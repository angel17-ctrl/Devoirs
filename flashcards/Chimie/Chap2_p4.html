<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcards</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#eef1f8;--surface:#fff;--ink:#1b2340;--muted:#5d6788;--accent:#2f5bea;--accent-ink:#fff;--back:#1b2340;--back-ink:#fff;--ok:#1f8a5b;--no:#c4432f;--line:#d5dbec}
@media (prefers-color-scheme:dark){:root{--bg:#10152a;--surface:#1a2140;--ink:#e8ecfa;--muted:#9aa5cc;--accent:#7b9bff;--accent-ink:#10152a;--back:#7b9bff;--back-ink:#10152a;--ok:#4cc38a;--no:#ff8a73;--line:#2b345c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hidden{display:none}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.scene{perspective:1200px;margin:18px 0}
.card{position:relative;height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s;border-radius:18px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:1.35rem;font-weight:600;overflow:auto}
.front{background:var(--surface);border:2px solid var(--line)}
.back{background:var(--back);color:var(--back-ink);transform:rotateY(180deg)}
.note{font-size:.9rem;font-weight:400;opacity:.85;margin-top:16px;max-width:90%}
.hint{font-size:.8rem;font-weight:400;opacity:.65;margin-top:14px}
.nav{display:flex;gap:10px}
.nav button{flex:1}
.ok{border-color:var(--ok);color:var(--ok)}.no{border-color:var(--no);color:var(--no)}
.end{text-align:center;padding:40px 10px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <div class="meta"><span id="pos"></span><span id="score"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="scene">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Retourner la carte">
      <div class="face front"><div id="q"></div><div class="hint">Touche pour voir la réponse</div></div>
      <div class="face back"><div id="a"></div><div class="note" id="n"></div></div>
    </div>
  </div>
  <div class="nav">
    <button class="no" id="bad">À revoir</button>
    <button class="ok" id="good">Je sais</button>
  </div>
  <div class="row">
    <button id="prev">← Précédente</button>
    <button id="next">Suivante →</button>
    <button id="shuf">Mélanger</button>
  </div>
  <div id="end" class="end hidden">
    <h1 id="endt"></h1>
    <div class="row" style="justify-content:center"><button class="primary" id="redo">Refaire les cartes à revoir</button><button id="all">Tout recommencer</button></div>
  </div>
</main>

<script>
/* =====================================================
   MODIFIE TES QUESTIONS / RÉPONSES ICI (et seulement ici)

   Une ligne = une carte :   ["question", "réponse"],
   - garde les guillemets et la virgule à la fin de chaque ligne
   - FORMULES : écris-les entre $...$ et DOUBLE chaque antislash
       \\frac{a}{b}   \\alpha   \\lambda   \\sqrt{x}   x^2   x_1
   - évite les guillemets " à l'intérieur d'une question
   - COMMENTAIRE (facultatif) : ajoute un 3e texte, il s'affiche
     en plus petit sous la réponse :
       ["question", "réponse", "commentaire"],
   ===================================================== */
var CARDS = [
  ["Qu'est-ce qu'un électron célibataire ?",
     "Un seul électron dans une case quantique.",
     ""],
    ["Qu'est-ce que des électrons appariés ?",
     "Deux électrons de spins antiparallèles dans une même case quantique : ils forment une paire ou un doublet.",
     ""],
    ["Comment simplifie-t-on la notation d'une configuration électronique ?",
     "On note entre crochets la configuration du gaz noble précédent dans la classification périodique, puis on complète avec les autres électrons.",
     "Ex : Se ($Z = 34$) : $[\\text{Ar}]\\, 4s^2 3d^{10} 4p^4$ ; Rb ($Z = 37$) : $[\\text{Kr}]\\, 5s^1$ ; $\\text{Mg}^{2+}$ : $[\\text{Ne}]$."],
    ["Comment s'exprime l'énergie d'un atome ?",
     "C'est la somme des énergies de chaque électron.",
     ""],
    ["Qu'est-ce que l'état fondamental ? Et un état excité ?",
     "Fondamental : configuration de plus basse énergie, qui respecte les trois règles (Klechkowski, Pauli, Hund). Excité : au moins une des règles n'est pas respectée.",
     ""],
    ["Quand un atome est-il paramagnétique ?",
     "Quand sa configuration présente au moins un électron célibataire : les moments magnétiques peuvent s'aligner avec un aimant, l'atome est attiré par un champ magnétique.",
     "Ex : O ($2p^4$ : 2 électrons célibataires), S, Se."],
    ["Quand un atome est-il diamagnétique ?",
     "Quand tous ses électrons sont appariés : les champs magnétiques des spins opposés s'annulent, il n'y a pas de moment magnétique net, et l'atome n'est pas attiré par un champ magnétique.",
     "Ex : He, Ne."],
    ["Quels sont les électrons de valence ?",
     "Ceux de la couche $n$ la plus élevée, plus ceux de la sous-couche $(n-1)d$ ou $(n-2)f$ en cours de remplissage. Ce sont eux qui participent aux réactions chimiques.",
     ""],
    ["Quels sont les électrons de cœur ?",
     "Tous les autres électrons, plus proches du noyau.",
     ""],
    ["Donner les électrons de valence de l'azote N ($Z = 7$) : $1s^2 2s^2 2p^3$.",
     "5 électrons de valence ($2s^2 2p^3$) ; 2 électrons de cœur ($1s^2$).",
     "La couche $n = 2$ est la plus élevée."],
    ["Donner les électrons de valence de Mn ($Z = 25$) : $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^5$.",
     "7 électrons de valence ($4s^2 3d^5$) ; 18 électrons de cœur.",
     "La sous-couche $3d$, en cours de remplissage, compte comme valence."],
    ["Donner les électrons de valence de Se ($Z = 34$) : $[\\text{Ar}]\\, 4s^2 3d^{10} 4p^4$.",
     "6 électrons de valence ($4s^2 4p^4$) ; 28 électrons de cœur.",
     "La sous-couche $3d$ est pleine : ses électrons sont de cœur."]
  ];
/* ===================== FIN ===================== */

var $=function(i){return document.getElementById(i)};
var all=CARDS.map(function(c){return{q:c[0],a:c[1],n:c[2]||""}}),deck=[],i=0,known={},missed=[];

function renderMath(){
  if(!window.renderMathInElement)return;
  renderMathInElement($("card"),{delimiters:[
    {left:"$$",right:"$$",display:true},
    {left:"$",right:"$",display:false}
  ],throwOnError:false});
}
function start(cards){deck=cards.slice();i=0;known={};missed=[];show()}
function show(){
  var done=i>=deck.length;
  $("end").classList.toggle("hidden",!done);
  document.querySelector(".scene").classList.toggle("hidden",done);
  document.querySelector(".nav").classList.toggle("hidden",done);
  var n=Object.keys(known).length;
  $("score").textContent=n+" sue"+(n>1?"s":"");
  $("fill").style.width=(deck.length?Math.min(i,deck.length)/deck.length*100:0)+"%";
  if(done){
    $("pos").textContent="Terminé";
    $("endt").textContent=n+" / "+deck.length+" cartes sues";
    $("redo").classList.toggle("hidden",!missed.length);
    return;
  }
  $("pos").textContent="Carte "+(i+1)+" / "+deck.length;
  $("card").classList.remove("flip");
  $("q").textContent=deck[i].q;$("a").textContent=deck[i].a;
  $("n").textContent=deck[i].n;$("n").classList.toggle("hidden",!deck[i].n);
  renderMath();
}
function go(d){i=Math.max(0,Math.min(deck.length,i+d));show()}
function mark(ok){
  if(i>=deck.length)return;
  if(ok){known[i]=1;missed=missed.filter(function(c){return c!==deck[i]})}
  else{delete known[i];if(missed.indexOf(deck[i])<0)missed.push(deck[i])}
  go(1);
}
$("card").onclick=function(){this.classList.toggle("flip")};
$("card").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();this.classList.toggle("flip")}};
$("next").onclick=function(){go(1)};
$("prev").onclick=function(){go(-1)};
$("good").onclick=function(){mark(true)};
$("bad").onclick=function(){mark(false)};
$("shuf").onclick=function(){
  for(var k=deck.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=deck[k];deck[k]=deck[j];deck[j]=t}
  i=0;known={};show();
};
$("redo").onclick=function(){start(missed)};
$("all").onclick=function(){start(all)};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1);
  if(e.key==="ArrowLeft")go(-1);
});
var sx=null;
$("card").addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
$("card").addEventListener("touchend",function(e){
  if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>60){go(dx<0?1:-1);e.preventDefault()}
});
window.addEventListener("load",renderMath);
start(all);
</script>
</body>
</html>
